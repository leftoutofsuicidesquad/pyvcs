[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvcs"
version = "0.1.0"
description = "A minimal Git implementation in Python"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
